name: Refresh data

# Statistik Austria publishes the annual series once a year and the quarterly
# series each quarter, so a monthly check comfortably catches every release
# while keeping the job cheap. workflow_dispatch covers off-schedule refreshes.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch, rebuild and validate
        run: python pipeline/update.py --force
        # The pipeline is stdlib-only, so there is nothing to install.

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          VINTAGE=$(python -c "import json;print(json.load(open('public/data/manifest.json'))['source_vintage'])")
          git add -- public/data
          git commit -m "data: refresh from Statistik Austria ($VINTAGE)"
          git push
